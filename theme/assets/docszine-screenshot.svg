<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Docszine documentation theme preview</title>
  <desc id="desc">A white documentation-led WordPress theme with a gray Docs Tree sidebar, editorial typography, directory rows, and a current issue section.</desc>
  <rect width="1200" height="900" fill="#ffffff"/>
  <rect width="248" height="900" fill="#f6f6f7"/>
  <line x1="247" y1="64" x2="247" y2="900" stroke="#e2e2e3"/>
  <line x1="248" y1="63.5" x2="1200" y2="63.5" stroke="#e2e2e3"/>

  <g font-family="Arial,Helvetica,sans-serif" fill="#3c3c43">
    <text x="276" y="39" font-size="18" font-weight="700" letter-spacing="-.2">DOCSZINE</text>
    <text x="804" y="38" font-size="11" fill="#67676c">ABOUT</text>
    <text x="862" y="38" font-size="11" fill="#67676c">ARCHIVE</text>
