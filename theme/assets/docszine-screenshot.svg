    <text x="276" y="707" font-size="25" font-weight="600">The Reading Surface</text>
    <text x="276" y="735" font-size="13" fill="#67676c">Six essays on how documents make room for a reader.</text>
    <text x="276" y="779" font-size="11" fill="#e87917">Explore this issue →</text>
    <line x1="276" y1="819" x2="1144" y2="819" stroke="#e2e2e3"/>
    <text x="276" y="850" font-size="10" fill="#6b6c72">A QUIET READING SYSTEM FOR THE LIFE OF DOCUMENTS</text>
