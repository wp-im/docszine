    <text x="36" y="126" font-size="13" font-weight="600">Start here</text>
    <line x1="28" y1="143" x2="215" y2="143" stroke="#e2e2e3"/>
    <text x="36" y="174" font-size="12" font-weight="600">Reading instruments</text>
    <text x="52" y="200" font-size="11" fill="#67676c">A theme as a reader</text>
    <text x="52" y="222" font-size="11" fill="#67676c">Archive comes first</text>
    <text x="36" y="260" font-size="12" font-weight="600">Editorial practice</text>
    <text x="52" y="286" font-size="11" fill="#67676c">Principles and method</text>
    <text x="52" y="308" font-size="11" fill="#67676c">The smallest useful plugin</text>
    <text x="36" y="346" font-size="12" font-weight="600">About Docszine</text>
    <text x="28" y="850" font-size="9" letter-spacing="1.4" fill="#6b6c72">A DOCUMENT-LED THEME</text>

    <text x="276" y="123" font-size="10" font-weight="700" letter-spacing="2.1" fill="#e87917">DOCUMENTATION</text>
    <text x="276" y="190" font-size="66" font-weight="600" letter-spacing="-2.5">Docszine</text>
    <text x="276" y="228" font-size="19" fill="#67676c">Long-form reading, issue navigation, and the</text>
    <text x="276" y="257" font-size="19" fill="#67676c">structures that keep knowledge usable.</text>
    <line x1="276" y1="302" x2="1144" y2="302" stroke="#e2e2e3"/>

    <text x="276" y="350" font-size="17" font-weight="600">Start here</text>
    <text x="972" y="350" font-size="10" fill="#6b6c72">BROWSE THE DOCUMENTATION</text>
    <line x1="276" y1="367" x2="1144" y2="367" stroke="#e2e2e3"/>

    <text x="276" y="406" font-size="11" fill="#6b6c72">01</text>
    <text x="321" y="405" font-size="15" font-weight="600">Reading instruments</text>
    <text x="321" y="427" font-size="11" fill="#67676c">How a theme gives a document a horizon and a reader a way in.</text>
    <text x="1122" y="408" font-size="19" fill="#e87917">→</text>
    <line x1="276" y1="449" x2="1144" y2="449" stroke="#e2e2e3"/>

    <text x="276" y="488" font-size="11" fill="#6b6c72">02</text>
    <text x="321" y="487" font-size="15" font-weight="600">Editorial practice</text>
    <text x="321" y="509" font-size="11" fill="#67676c">Notes on structure, method, archives, and the care of long-form work.</text>
    <text x="1122" y="490" font-size="19" fill="#6b6c72">→</text>
    <line x1="276" y1="531" x2="1144" y2="531" stroke="#e2e2e3"/>

    <text x="276" y="570" font-size="11" fill="#6b6c72">03</text>
    <text x="321" y="569" font-size="15" font-weight="600">About Docszine</text>
    <text x="321" y="591" font-size="11" fill="#67676c">The project, its principles, and the publishing system behind the theme.</text>
    <text x="1122" y="572" font-size="19" fill="#6b6c72">→</text>
    <line x1="276" y1="613" x2="1144" y2="613" stroke="#e2e2e3"/>

